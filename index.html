<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps Training — CI/CD Deployment</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="badge">✓</div>
    <h1>DevOps Training</h1>

    <div class="counter-section">

      <button id="deploy-btn" type="button">Click Me!</button>
    </div>
  </main>
  <script src="script.js"></script>

</html>
